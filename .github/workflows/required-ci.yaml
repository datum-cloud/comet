name: Required CI

# Reports the "ci / Build and test" status check that the datum-cloud
# organization requires on the default branch. The fuller checks live in
# ci.yaml.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: datum-cloud/actions/.github/workflows/ci-basic.yaml@51f5aaf27abc090bdfd70c0a96d37aeb90273c9f # v1.31.0

# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: comet

builds:
  - id: comet
    main: .
    binary: comet
    env:
      - CGO_ENABLED=0
    # Windows is excluded: the SSH transport needs a pseudo-terminal, which
    # github.com/creack/pty does not provide there.
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    # Fixed file times make the archives reproducible from the same commit.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ tolower (print .ProjectName \"_\" .Version \"_\" .Os \"_\" .Arch) }}"
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive

# Keyless Sigstore signature over checksums.txt, which covers every archive.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - --yes
      - ${artifact}

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  prerelease: auto
